spring:
  application:
    name: aarogya-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aarogya}
    username: ${POSTGRES_USER:aarogya}
    password: ${POSTGRES_PASSWORD:aarogya_local}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: ${API_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:aarogya-local-development-secret-change-before-production-2026}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
