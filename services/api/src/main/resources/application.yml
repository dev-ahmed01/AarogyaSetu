spring:
  application:
    name: aarogya-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aarogya}
    username: ${POSTGRES_USER:aarogya}
    password: ${POSTGRES_PASSWORD:aarogya_local}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${API_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  runtime:
    environment: ${APP_ENV:local}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:aarogya-local-development-secret-change-before-production-2026}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    auth-rate-limit-attempts: ${AUTH_RATE_LIMIT_ATTEMPTS:20}
    auth-rate-limit-window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:300}
