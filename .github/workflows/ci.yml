name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  api:
    name: API + PostgreSQL checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aarogya_ci
          POSTGRES_USER: aarogya_ci
          POSTGRES_PASSWORD: aarogya_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aarogya_ci -d aarogya_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AAROGYA_INTEGRATION_TESTS: "true"
      APP_ENV: test
      DATABASE_URL: jdbc:postgresql://localhost:5432/aarogya_ci
      POSTGRES_USER: aarogya_ci
      POSTGRES_PASSWORD: aarogya_ci_password
      JWT_SECRET: ci-only-aarogya-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: Lax
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test application against PostgreSQL
        run: mvn --batch-mode test

  containers:
    name: Container build checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web, api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build API image
        run: docker build -t aarogya-api:ci services/api

      - name: Build web image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8080/api
          -t aarogya-web:ci
          apps/web
