services:
  db:
    image: postgres:16-alpine
    container_name: aarogya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aarogya}
      POSTGRES_USER: ${POSTGRES_USER:-aarogya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aarogya_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aarogya_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aarogya} -d ${POSTGRES_DB:-aarogya}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    container_name: aarogya-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      API_PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-aarogya}
      POSTGRES_USER: ${POSTGRES_USER:-aarogya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aarogya_local}
      JWT_SECRET: ${JWT_SECRET:-aarogya-local-development-secret-change-before-production-2026}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH_RATE_LIMIT_ATTEMPTS: ${AUTH_RATE_LIMIT_ATTEMPTS:-20}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
    container_name: aarogya-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  aarogya_postgres_data:
